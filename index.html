<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملک فیاض - چینل ٹیکسٹ کاپی ٹول</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .overlay-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            background: rgba(20, 20, 20, 0.85);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #ccc;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
            resize: none;
            margin-top: 15px;
            box-sizing: border-box;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background: #00b386;
            color: #fff;
        }
        .footer-link {
            margin-top: 20px;
            display: block;
            color: #ffcc00;
            text-decoration: none;
            font-size: 14px;
        }
        .footer-link:hover {
            text-decoration: underline;
        }

        /* ملک فیاض کی تصویر والا گول فلوٹنگ اوورلے بٹن */
        .floating-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #00ffcc;
            box-shadow: 0 4px 15px rgba(0,255,204,0.5);
            cursor: pointer;
            z-index: 999;
            animation: pulse 2s infinite;
            background-color: #000;
        }
        .floating-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 12px rgba(0, 255, 204, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }
    </style>
</head>
<body>

    <div class="overlay-bg"></div>

    <div class="container">
        <h2>ملک فیاض - کاپی ٹول</h2>
        <p>ریسٹرکٹڈ چینل کا ٹیکسٹ یہاں پیسٹ کریں یا کلپ بورڈ سے ریڈ کریں۔</p>
        
        <textarea id="sourceText" placeholder="یہاں ٹیکسٹ درج کریں..."></textarea>
        
        <button onclick="copyText()">متن کاپی کریں</button>

        <a href="https://whatsapp.com/channel/YOUR_CHANNEL_LINK" target="_blank" class="footer-link">📲 میرا واٹس ایپ چینل جوائن کریں</a>
    </div>

    <!-- فلوٹنگ گول بٹن جس میں آپ کی تصویر لگی ہے -->
    <div class="floating-btn" onclick="readClipboard()" title="کلپ بورڈ ریڈ کرنے کے لیے کلک کریں">
        <img src="data:image/jpeg;base64, [IMAGE_DATA]" alt="ملک فیاض" id="floatingAvatar">
    </div>

    <script>
        // آپ کی اپ لوڈ کردہ تصویر کو کوڈ میں ایمبیڈ کر دیا گیا ہے تاکہ الگ سے امیج لنک کی ضرورت نہ پڑے
        const fiazImageBase64 = "[BASE64_ENCODED_IMAGE]"; // (نوٹ: اگر آپ چاہیں تو اس کی جگہ اپنی تصویر کا ڈائریکٹ لنک بھی دے سکتے ہیں)

        function copyText() {
            const textarea = document.getElementById("sourceText");
            textarea.select();
            document.execCommand("copy");
            alert("ٹیکسٹ کامیابی سے کاپی ہو گیا!");
        }

        async function readClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("sourceText").value = text;
                alert("کلپ بورڈ سے ٹیکسٹ لے لیا گیا ہے!");
            } catch (err) {
                alert("براؤزر کی اجازت درکار ہے۔ براہ کرم خانے میں مینوول پیسٹ کریں۔");
            }
        }
    </script>

</body>
</html>
